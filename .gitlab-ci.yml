stages:
  - lint
  - build
  - deploy

variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:latest
  DEPLOY_PATH: "/opt/webproject"

# Vérification syntaxe PHP
lint:php:
  stage: lint
  image: php:8.2-cli
  script:
    - find . -name "*.php" -not -path "./node_modules/*" -not -path "./lib/phpmailer/*" -exec php -l {} \;
  only:
    - main
    - merge_requests

# Build et push l'image Docker vers GitLab Container Registry
build:image:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Injecter les fichiers de config secrets avant le build (hors webroot)
    - mkdir -p config
    - echo "$SMTP_CONFIG" > config/smtp_config.php
    - echo "$RECAPTCHA_CONFIG" > config/recaptcha_config.php
    # Build et push
    - docker build -t $IMAGE_TAG .
    - docker push $IMAGE_TAG
  only:
    - main

# Déployer sur le VPS
deploy:production:
  stage: deploy
  image: alpine:latest
  needs:
    - build:image
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    # Envoyer le docker-compose.yml sur le VPS
    - ssh $SSH_USER@$SSH_HOST "mkdir -p $DEPLOY_PATH"
    - scp docker-compose.yml $SSH_USER@$SSH_HOST:$DEPLOY_PATH/docker-compose.yml
    # Login au registry, pull et redémarrer
    - ssh $SSH_USER@$SSH_HOST "
        docker login -u gitlab-ci-token -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY} &&
        cd $DEPLOY_PATH &&
        docker compose pull &&
        docker compose up -d --force-recreate &&
        docker image prune -f
      "
  only:
    - main
  environment:
    name: production
    url: https://webprojectbxl.com
