# NOTE : la redirection www -> apex doit se faire dans nginx-proxy-manager
# (Redirection Host), pas ici : NPM transmet un Host fixe au conteneur,
# une redirection basée sur le Host boucle à l'infini.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # Sécurité headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Bloquer l'accès aux fichiers sensibles
    location ~ /\.(ht|git|env|gitlab) {
        deny all;
    }

    # Cache fichiers statiques
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
